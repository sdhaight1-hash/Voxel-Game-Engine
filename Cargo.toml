[package]
name = "texture-studio"
version = "0.1.0"
edition = "2021"
description = "Voxel Game Engine: procedural voxel assets, foliage and node-based materials"

[dependencies]
eframe = { version = "0.37", features = ["wgpu"] }
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
rfd = "0.17"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
